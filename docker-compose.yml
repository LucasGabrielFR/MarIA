version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
    # Add your production database URLs and secrets here
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://backend:3000
    env_file:
      - ./backend/.env  # Often shares some environment variables, or specify a landing-specific env
    restart: unless-stopped
